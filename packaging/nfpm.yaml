name: remoteble
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Yahia Mohammad <yahia.mohammad.alhussiny@gmail.com>
vendor: Warsha
homepage: https://github.com/Yahia-Mohammad/remote-ble-tools
license: Apache-2.0
description: >-
  Command-line client and Agent Skill for RemoteBLE.
contents:
  - src: ${STAGE_DIR}/dist/bin/remoteble
    dst: /usr/bin/remoteble
    file_info:
      mode: 0755
  - src: ${STAGE_DIR}/dist/bin/rble
    dst: /usr/bin/rble
    file_info:
      mode: 0755
  - src: ${STAGE_DIR}/dist/man/remoteble.1
    dst: /usr/share/man/man1/remoteble.1
  - src: ${STAGE_DIR}/dist/completions/remoteble.bash
    dst: /usr/share/bash-completion/completions/remoteble
  - src: ${STAGE_DIR}/dist/completions/remoteble.zsh
    dst: /usr/share/zsh/site-functions/_remoteble
  - src: ${STAGE_DIR}/dist/completions/remoteble.fish
    dst: /usr/share/fish/vendor_completions.d/remoteble.fish
  - src: ${STAGE_DIR}/dist/skills/remoteble
    dst: /usr/share/remoteble/skills/remoteble
    type: tree
  - src: ${STAGE_DIR}/LICENSE
    dst: /usr/share/doc/remoteble/LICENSE
  - src: ${STAGE_DIR}/NOTICE
    dst: /usr/share/doc/remoteble/NOTICE
  - src: ${STAGE_DIR}/sbom.json
    dst: /usr/share/doc/remoteble/sbom.json
overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc
