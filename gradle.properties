org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
remoteble.version=0.1.0-SNAPSHOT

# KT-46377: the Kotlin/Native compiler cache stores a klib's symbols ahead of the final link, and
# for clikt 5.x the linuxX64/linuxArm64 test binaries then link `Context.selfAndAncestors` twice --
# once from the cached archive, once from the freshly compiled klib -- so ld.lld aborts with
# `duplicate symbol: kfun:com.github.ajalt.clikt.core#selfAndAncestors...`. Only the Linux test
# links hit it (macosArm64 caches cleanly), and upgrading clikt to 5.1.0 does not help. Disabling
# the cache for these two targets costs link time on a job that already builds from clean.
kotlin.native.cacheKind.linuxX64=none
kotlin.native.cacheKind.linuxArm64=none
