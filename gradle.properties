org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
# Kotlin/Native 2.4.21's static library cache on a Linux host fails debug links with a duplicate
# clikt symbol (`selfAndAncestors`, defined in both clikt and clikt-mordant). Release binaries
# never use the cache, so this only makes linuxX64 debug and test links slower. Retry without it
# on the next Kotlin bump.
kotlin.native.cacheKind.linuxX64=none
remoteble.version=0.2.0-SNAPSHOT
