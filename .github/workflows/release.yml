name: release

on:
  push:
    tags: ['v*']

# Only the final job receives write authority. It publishes only after this tagged commit has run
# the same JVM, live-agent, formatting, and packaging verification required for a merge.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify dependency locks
        run: |
          ./gradlew dependencies --no-daemon
          git diff --exit-code -- '**/gradle.lockfile' settings-gradle.lockfile
      - name: Verify and package the tagged commit
        run: ./gradlew :core:jvmTest :cli:validateSkill :cli:jvmTest :integration-tests:test :integration-tests:fetchAgent :integration-tests:liveAgentTest :cli:releaseArchive :cli:skillChecksum formatCheck -Premoteble.agent.required=true -Premoteble.version="${GITHUB_REF_NAME#v}"
      - run: |
          unzip -q cli/build/distributions/remoteble-*.zip -d "$RUNNER_TEMP/jvm-release"
          ( cd "$RUNNER_TEMP/jvm-release" && shasum -a 256 -c SHA256SUMS )
          test -s "$RUNNER_TEMP/jvm-release/sbom.json"
          test -x "$RUNNER_TEMP/jvm-release/dist/bin/remoteble"
          "$RUNNER_TEMP/jvm-release/dist/bin/remoteble" --version
          test -f "$RUNNER_TEMP/jvm-release/dist/completions/remoteble.bash"
          test -f "$RUNNER_TEMP/jvm-release/dist/man/remoteble.1"
          test -f "$RUNNER_TEMP/jvm-release/dist/skills/remoteble/SKILL.md"
          ( cd cli/build/distributions && shasum -a 256 -c remoteble-skill-*.zip.sha256 )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-jvm
          path: |
            cli/build/distributions/remoteble-*.zip
            cli/build/distributions/remoteble-skill-*.zip.sha256
          if-no-files-found: error

  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :core:macosArm64Test :cli:macosArm64Test :integration-tests:nativeLockHandoffTest :cli:macosArm64NativeArchive -Premoteble.version="${GITHUB_REF_NAME#v}"
      - run: |
          cli/build/bin/macosArm64/remotebleReleaseExecutable/remoteble.kexe --help
          unzip -q cli/build/distributions/remoteble-macos-arm64-*.zip -d "$RUNNER_TEMP/macos-release"
          ( cd "$RUNNER_TEMP/macos-release" && shasum -a 256 -c SHA256SUMS )
          test -f "$RUNNER_TEMP/macos-release/dist/completions/remoteble.bash"
          test -f "$RUNNER_TEMP/macos-release/dist/man/remoteble.1"
          test -f "$RUNNER_TEMP/macos-release/dist/skills/remoteble/SKILL.md"
          "$RUNNER_TEMP/macos-release/dist/bin/remoteble" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-macos-arm64
          path: cli/build/distributions/remoteble-macos-arm64-*.zip
          if-no-files-found: error

  native-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :core:linuxX64Test :cli:linuxX64Test :integration-tests:nativeLockHandoffTest :cli:linuxX64NativeArchive -Premoteble.version="${GITHUB_REF_NAME#v}"
      - run: |
          cli/build/bin/linuxX64/remotebleReleaseExecutable/remoteble.kexe --help
          unzip -q cli/build/distributions/remoteble-linux-x64-*.zip -d "$RUNNER_TEMP/linux-x64-release"
          ( cd "$RUNNER_TEMP/linux-x64-release" && shasum -a 256 -c SHA256SUMS )
          test -f "$RUNNER_TEMP/linux-x64-release/dist/completions/remoteble.bash"
          test -f "$RUNNER_TEMP/linux-x64-release/dist/man/remoteble.1"
          test -f "$RUNNER_TEMP/linux-x64-release/dist/skills/remoteble/SKILL.md"
          "$RUNNER_TEMP/linux-x64-release/dist/bin/remoteble" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-linux-x64
          path: cli/build/distributions/remoteble-linux-x64-*.zip
          if-no-files-found: error

  native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :core:linuxArm64Test :cli:linuxArm64Test :integration-tests:nativeLockHandoffTest :cli:linuxArm64NativeArchive -Premoteble.version="${GITHUB_REF_NAME#v}"
      - run: |
          cli/build/bin/linuxArm64/remotebleReleaseExecutable/remoteble.kexe --help
          unzip -q cli/build/distributions/remoteble-linux-arm64-*.zip -d "$RUNNER_TEMP/linux-arm64-release"
          ( cd "$RUNNER_TEMP/linux-arm64-release" && shasum -a 256 -c SHA256SUMS )
          test -f "$RUNNER_TEMP/linux-arm64-release/dist/completions/remoteble.bash"
          test -f "$RUNNER_TEMP/linux-arm64-release/dist/man/remoteble.1"
          test -f "$RUNNER_TEMP/linux-arm64-release/dist/skills/remoteble/SKILL.md"
          "$RUNNER_TEMP/linux-arm64-release/dist/bin/remoteble" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-linux-arm64
          path: cli/build/distributions/remoteble-linux-arm64-*.zip
          if-no-files-found: error

  publish:
    needs: [jvm, native-macos, native-linux-x64, native-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: remoteble-*
          path: release-artifacts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" $(find release-artifacts -type f \( -name '*.zip' -o -name '*.zip.sha256' \) -print) \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
