name: verify

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '23 4 * * 1'

# Verification never needs to write repository state. Publishing is isolated in release.yml.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew dependencies --no-daemon
      - run: git diff --exit-code -- '**/gradle.lockfile' settings-gradle.lockfile

  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :core:jvmTest :cli:validateSkill :cli:jvmTest :integration-tests:test :cli:fatJar :cli:skillChecksum formatCheck

  # The only job that exercises the wire protocol. Everything else asserts what this code does with
  # its own types; this asserts what a released agent actually answers, which is where a protocol
  # regression would surface. The agent runs radio-less via its `--simulate` mode, so no adapter,
  # container, or privilege is needed. The version is pinned in integration-tests/build.gradle.kts:
  # floating it would turn an upstream release into a failure on an unrelated change.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Fetch the pinned RemoteBLE agent
        run: ./gradlew :integration-tests:fetchAgent
      # `remoteble.agent.required` makes a misconfigured agent fail the job rather than skip every
      # scenario and report green.
      - name: Run live-agent integration tests
        run: ./gradlew :integration-tests:liveAgentTest -Premoteble.agent.required=true
      - name: Upload acceptance evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-results
          path: integration-tests/build/reports/tests/liveAgentTest

  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :core:macosArm64Test :cli:macosArm64Test :integration-tests:nativeLockHandoffTest :cli:macosArm64NativeArchive
      - run: |
          cli/build/bin/macosArm64/remotebleReleaseExecutable/remoteble.kexe --help
          unzip -q cli/build/distributions/remoteble-macos-arm64-*.zip -d "$RUNNER_TEMP/macos-archive"
          "$RUNNER_TEMP/macos-archive/dist/bin/remoteble" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-macos-arm64
          path: cli/build/distributions/remoteble-macos-arm64-*.zip

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # The Native state lock and record reader are the two places where this CLI depends on
      # libc behaviour that differs between platforms, so their tests have to run on Linux and
      # not only on the macOS runner.
      - run: ./gradlew :core:linuxX64Test :cli:linuxX64Test :integration-tests:nativeLockHandoffTest :cli:linuxX64NativeArchive
      - run: |
          cli/build/bin/linuxX64/remotebleReleaseExecutable/remoteble.kexe --help
          unzip -q cli/build/distributions/remoteble-linux-x64-*.zip -d "$RUNNER_TEMP/linux-x64-archive"
          "$RUNNER_TEMP/linux-x64-archive/dist/bin/remoteble" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-linux-x64
          path: cli/build/distributions/remoteble-linux-x64-*.zip

  native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :core:linuxArm64Test :cli:linuxArm64Test :integration-tests:nativeLockHandoffTest :cli:linuxArm64NativeArchive
      - run: |
          cli/build/bin/linuxArm64/remotebleReleaseExecutable/remoteble.kexe --help
          unzip -q cli/build/distributions/remoteble-linux-arm64-*.zip -d "$RUNNER_TEMP/linux-arm64-archive"
          "$RUNNER_TEMP/linux-arm64-archive/dist/bin/remoteble" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-linux-arm64
          path: cli/build/distributions/remoteble-linux-arm64-*.zip

  package:
    runs-on: ubuntu-latest
    needs: [jvm, acceptance, native-macos, native-linux, native-linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :cli:releaseArchive :cli:skillChecksum
      - run: test -s cli/build/distributions/remoteble-*.zip
      - run: unzip -l cli/build/distributions/remoteble-*.zip | grep -E 'LICENSE|NOTICE|SHA256SUMS|sbom.json|rble'
      - run: unzip -l cli/build/distributions/remoteble-*.zip | grep -q 'dist/skills/remoteble/SKILL.md'
      - run: ( cd cli/build/distributions && test -s remoteble-skill-*.zip && shasum -a 256 -c remoteble-skill-*.zip.sha256 )
      # The SBOM used to ship as a placeholder that declared no dependencies. A scanner treats that
      # as authoritative, so assert the document lists real libraries rather than arriving as an
      # empty application-only component.
      - run: |
          unzip -p cli/build/distributions/remoteble-*.zip sbom.json \
            | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b["bomFormat"]=="CycloneDX"; assert sum(1 for c in b["components"] if c["type"]=="library")>=10'
      # Extract rather than list: an entry can be present and still arrive non-executable, which is
      # a broken install for anyone who unzips the archive and runs the launcher.
      - run: |
          unzip -q cli/build/distributions/remoteble-*.zip -d "$RUNNER_TEMP/jvm-archive"
          test -x "$RUNNER_TEMP/jvm-archive/dist/bin/remoteble"
          test -x "$RUNNER_TEMP/jvm-archive/dist/bin/rble"
          "$RUNNER_TEMP/jvm-archive/dist/bin/remoteble" --version
          test -f "$RUNNER_TEMP/jvm-archive/dist/completions/remoteble.bash"
          test -f "$RUNNER_TEMP/jvm-archive/dist/man/remoteble.1"
          skill_home="$RUNNER_TEMP/jvm-skill-home"
          HOME="$skill_home" "$RUNNER_TEMP/jvm-archive/dist/bin/remoteble" skills install --target codex --scope user
          HOME="$skill_home" "$RUNNER_TEMP/jvm-archive/dist/bin/remoteble" skills doctor --target codex --scope user
          printf 'modified\n' > "$skill_home/.agents/skills/remoteble/SKILL.md"
          ! HOME="$skill_home" "$RUNNER_TEMP/jvm-archive/dist/bin/remoteble" skills install --target codex --scope user
          HOME="$skill_home" "$RUNNER_TEMP/jvm-archive/dist/bin/remoteble" skills install --target codex --scope user --force
          test -d "$skill_home/.agents/skills/remoteble"
          test -d "$(dirname "$skill_home/.agents/skills/remoteble")"/remoteble.backup-*
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: remoteble-*
          path: cli/build/native-distributions
          merge-multiple: false
      - run: |
          test -s cli/build/native-distributions/remoteble-macos-arm64/remoteble-macos-arm64-*.zip
          test -s cli/build/native-distributions/remoteble-linux-x64/remoteble-linux-x64-*.zip
          test -s cli/build/native-distributions/remoteble-linux-arm64/remoteble-linux-arm64-*.zip
          for archive in cli/build/native-distributions/*/*.zip; do
            unzip -l "$archive" | grep -q 'LICENSE'
            unzip -l "$archive" | grep -q 'NOTICE'
            unzip -l "$archive" | grep -q 'SHA256SUMS'
            unzip -l "$archive" | grep -q 'sbom.json'
            target="$RUNNER_TEMP/native-archive/$(basename "$(dirname "$archive")")"
            unzip -q "$archive" -d "$target"
            ( cd "$target" && shasum -a 256 -c SHA256SUMS )
            test -x "$target/dist/bin/remoteble"
            test -x "$target/dist/bin/rble"
            test -f "$target/dist/completions/remoteble.bash"
            test -f "$target/dist/man/remoteble.1"
            test -f "$target/dist/skills/remoteble/SKILL.md"
            skill_home="$target/skill-home"
            HOME="$skill_home" "$target/dist/bin/remoteble" skills install --target codex --scope user
            HOME="$skill_home" "$target/dist/bin/remoteble" skills doctor --target codex --scope user
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remoteble-skill
          path: |
            cli/build/distributions/remoteble-skill-*.zip
            cli/build/distributions/remoteble-skill-*.zip.sha256
