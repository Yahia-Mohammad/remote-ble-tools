# Temporary. The release job's tap push is the one step no rehearsal reaches: a prerelease skips
# the whole Homebrew job, so a mis-scoped HOMEBREW_TAP_TOKEN would first surface at the last step
# of the first real release. This proves the credential without publishing anything, and should be
# deleted once that release has succeeded.
name: tap-credential-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - name: Verify the tap credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$TAP_REPOSITORY" || { echo "HOMEBREW_TAP_REPOSITORY is not configured" >&2; exit 1; }
          gh auth setup-git
          # Cloning proves the token authenticates and can read the tap.
          gh repo clone "$TAP_REPOSITORY" tap
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # A never-published tap has no commits, so make one locally to have something to offer.
          # It is never pushed for real.
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "credential check" > .credential-check
            git add .credential-check
            git commit -qm "credential check"
          fi
          # `--dry-run` still opens git-receive-pack, which GitHub refuses with 403 unless the
          # token carries Contents: write -- so this fails loudly on a mis-scoped token while
          # leaving no ref behind. Pushing a real scratch branch would instead become the default
          # branch of an empty tap, and a default branch cannot be deleted afterwards.
          git push --dry-run origin HEAD:refs/heads/main
          echo "OK: the tap credential authenticates and carries push access to $TAP_REPOSITORY"
