schemaVersion: 1
agent:
  endpoint: ws://127.0.0.1:8080/agent
  tokenEnvironmentVariable: REMOTE_BLE_TOKEN
defaults:
  scanDuration: 5s
  operationTimeout: 20s
  output: human
policy:
  readOnly: true
profiles:
  lab:
    agent:
      # RemoteBLE 0.14+ agents reached over the network serve wss:// behind a self-signed
      # identity; pin the fp= value the agent prints with --print-pairing.
      endpoint: wss://192.0.2.10:8080/agent
      fingerprint: sha256:8bddc8daceca6b001bd79b40cea6d53df1a570711087b25f426c9b711a2b98a4
